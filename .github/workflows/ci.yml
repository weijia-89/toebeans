name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  fitness-functions:
    name: Fitness functions (lint-class CI gates)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: No-network gate
        run: bash scripts/test_no_network.sh .
      - name: No-analytics gate
        run: bash scripts/test_no_analytics.sh .
      - name: Scheduler-purity gate
        run: bash scripts/test_scheduler_purity.sh .
      - name: Permission-allowlist gate
        run: bash scripts/test_permission_allowlist.sh .
      - name: No-PII-in-crash-log gate (ADR-0009)
        run: bash scripts/test_no_pii_in_crash_log.sh .
      - name: POST_NOTIFICATIONS silent-notify gate (ADR-0011)
        run: bash scripts/test_post_notifications_silent_failure_guard.sh .
      - name: POST_NOTIFICATIONS silent-notify self-test
        run: bash scripts/test_test_post_notifications_silent_failure_guard.sh .
      - name: No-PBKDF2-in-backup-after-TBN2 gate (ADR-0018)
        # The script is gated on TBN2 presence in the source tree. Pre-D1 the
        # script no-ops with an info message; post-D1 (TBN2 envelope live in
        # BackupCipherV2) the script enforces that PBKDF2 references in the
        # backup module are limited to the explicitly allow-listed TBN1 legacy
        # decrypt path. See scripts/test_no_pbkdf2_in_backup_after_tbn2.sh
        # header for allow-marker syntax.
        run: bash scripts/test_no_pbkdf2_in_backup_after_tbn2.sh .
      - name: No-duplicate-private-test-class-names gate (ADR-0017 Lesson 2)
        run: bash scripts/test_no_duplicate_private_test_class_names.sh .
      - name: AGENTS / CLAUDE parity
        # Contract files are local-only working copies; this step skips when absent.
        run: bash scripts/agents_claude_parity.sh .
      - name: AGENTS / CLAUDE parity self-test
        run: bash scripts/test_test_agents_claude_parity.sh .
      - name: AGP-9 built-in-Kotlin migration gate
        run: bash scripts/test_agp9_builtin_kotlin_migration.sh .
      - name: AGP-9 built-in-Kotlin migration self-test
        run: bash scripts/test_test_agp9_builtin_kotlin_migration.sh .
      - name: Pre-commit hook self-test (secrets regex + vibe-dangerous pattern sync)
        run: bash scripts/test_pre_commit_hook.sh .
      - name: Duplicate-private fitness-function self-test
        run: bash scripts/test_test_no_duplicate_private_test_class_names.sh .
      - name: No-PBKDF2-after-TBN2 fitness-function self-test
        run: bash scripts/test_test_no_pbkdf2_in_backup_after_tbn2.sh .
      - name: Manual QA catalog gate
        # A test-plan block with steps and an expected result must add
        # docs/manual-qa/cases/<slug>.md and link it from docs/manual-qa.md.
        # Gradle-only lines are not manual cases. The self-test feeds fixtures.
        run: bash scripts/test_manual_qa_catalog.sh .
      - name: Manual QA catalog fitness-function self-test
        run: bash scripts/test_test_manual_qa_catalog.sh .
      - name: Trainer PR review gate self-test
        run: bash scripts/test_ci_trainer_pr_review_gate.sh .
      - name: Trainer gate rerun self-test
        run: bash scripts/test_trainer_pr_review_gate_rerun.sh .
      - name: Trainer patch head self-test
        run: bash scripts/test_trainer_pr_review_patch_head.sh
      - name: Sprint scheduler kit tests
        run: bash scripts/scheduler/tests/test-scheduler.sh

  trainer-pr-review-gate:
    # PR-only. Fails until a canonical trainer/sdk codereview comment exists on the
    # PR with head= matching HEAD and ### Trainer notes (forbids ### Pedagogy).
    name: Trainer PR review comment gate
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Sync trainer review head= to PR HEAD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! -f scripts/trainer_pr_review_patch_head.sh ]]; then
            echo "trainer_pr_review_patch_head.sh not in PR checkout; skip head sync"
            exit 0
          fi
          bash scripts/trainer_pr_review_patch_head.sh \
            "${{ github.event.pull_request.number }}" \
            "${{ github.repository }}"
      - name: Require trainer code-review comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          bash scripts/ci-trainer-pr-review-gate.sh \
            "${{ github.event.pull_request.number }}" \
            "${{ github.event.pull_request.head.sha }}" \
            "${{ github.event.pull_request.head.ref }}" \
            "${{ github.repository }}"

  vibe-dangerous-gate:
    # Survives `git commit --no-verify`. Enforces the same rule as
    # scripts/git-hooks/pre-commit: any vibe-dangerous path change must be paired
    # with a new calibration entry. The local hook is the fast path; this is the
    # belt-and-suspenders gate.
    name: Vibe-dangerous review gate (--no-verify defense)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need full history to diff base..head
      - name: Determine SHA range
        id: range
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Run vibe-dangerous CI check
        env:
          GITHUB_REF_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          bash scripts/ci-vibe-dangerous-check.sh \
            "${{ steps.range.outputs.base }}" \
            "${{ steps.range.outputs.head }}" \
            "${{ github.event.pull_request.head.ref }}"

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  dependency-review:
    # PR-only. Blocks dependency additions that introduce high-severity CVEs or
    # are missing licenses. Slopsquatting defense aligns with the local
    # agent-host contract Hallucination vigilance rule.
    name: Dependency review
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - name: Run dependency-review-action
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  build-and-test:
    # Runs in parallel with trainer-pr-review-gate (buds pattern). Gate still
    # fails the workflow until the canonical PR comment exists; it must not
    # block Gradle signal on first push or while the agent posts/PATCHes review.
    name: Gradle build + shared tests
    runs-on: ubuntu-24.04
    needs: [fitness-functions]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: Lint (ktlint + detekt)
        # detekt 2.0.0-alpha.6 is not configuration-cache safe. The repository keeps
        # configuration-cache=true/problems=fail for all other tasks; detekt opts out
        # explicitly here (operator override, logged). :shared:detektShared is required
        # because the detekt 2 umbrella :shared:detekt is NO-SOURCE.
        run: ./gradlew ktlintCheck detekt :shared:detektShared --no-configuration-cache --stacktrace
      - name: Shared JVM + Android host tests (scheduler, backup, model)
        run: ./gradlew :shared:jvmTest :shared:testAndroidHostTest --stacktrace
      - name: Assert both shared suites ran more than zero tests
        run: |
          for task in jvmTest testAndroidHostTest; do
            count=$((grep -h -o '<testcase ' shared/build/test-results/$task/*.xml 2>/dev/null || true) | wc -l | tr -d ' ')
            if [ "$count" -le 0 ]; then
              echo "::error::$task ran $count test cases; refusing a green build with no tests"
              exit 1
            fi
            echo "$task ran $count test cases"
          done
      - name: SQLDelight golden-schema drift gate (verify migrations from 1.db)
        run: ./gradlew :shared:verifySqlDelightMigration --stacktrace
      - name: Coverage verification (Kover, line coverage ≥ 85% per ADR-0006)
        run: ./gradlew :shared:koverVerify --stacktrace
      - name: Android app assembleDebug
        run: ./gradlew :androidApp:assembleDebug --stacktrace
