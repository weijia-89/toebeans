# Robolectric defaults for all androidApp unit tests.
#
# Before ADR-0013 (isIncludeAndroidResources = true), no unit test booted the
# real application class: without merged manifest resources Robolectric fell
# back to a plain Application. That flag makes Robolectric find the merged
# manifest and boot ToebeansApp, whose onCreate calls startKoin — a global
# singleton that then throws KoinApplicationAlreadyStartedException in every
# later test in the same JVM. Pinning application=android.app.Application
# restores the pre-ADR-0013 boot behavior for every test while keeping merged
# resources available for Compose ui-test's ComponentActivity launch.
# Individual tests that need ToebeansApp can override with @Config(application=...).
application=android.app.Application
